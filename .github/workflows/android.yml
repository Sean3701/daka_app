name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daka-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  # Pushing a tag like v1.1.0 publishes that build as a GitHub Release with the
  # debug APK attached, so there is always a downloadable file for every version.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: daka-debug-${{ github.run_number }}
          path: apk
      - name: Rename APK with version
        run: |
          set -euo pipefail
          for f in apk/*.apk; do
            mv "$f" "apk/daka-${GITHUB_REF_NAME}-debug.apk"
          done
          ls -lh apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo "${GITHUB_REPOSITORY}" --title "daka ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag)
          # Tags such as v1.1.0-beta1 are published as pre-releases.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" apk/*.apk
