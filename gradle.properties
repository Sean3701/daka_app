org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Skip AGP's non-ASCII path check. This project may live under a path
# containing non-ASCII characters (e.g. "打卡app"), which AGP rejects by
# default. The flag only bypasses the check and does not alter build output.
# Remove this line if the project is moved to a plain ASCII path.
android.overridePathCheck=true
